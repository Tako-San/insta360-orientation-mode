name: CI

on:
  push:
  pull_request:

jobs:
  lib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Гоняем только pure-JVM модуль :lib — он не зависит от Android SDK и от
      # приватного Nexus Insta360 (недоступного из облачного раннера). Сборка :app
      # требует SDK с Nexus и проверяется локально / на self-hosted runner.
      - name: Run :lib unit tests
        run: ./gradlew :lib:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-test-report
          path: lib/build/reports/tests/
          if-no-files-found: warn
