name: CI

on:
  push:
  pull_request:

jobs:
  lib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the pure-JVM :lib module runs here — it has no Android SDK dependency
      # and no dependency on the private Insta360 Nexus (unreachable from the cloud
      # runner). The :app build needs the SDK/Nexus and is verified locally /
      # on a self-hosted runner.
      - name: Run :lib unit tests with coverage gate
        run: ./gradlew :lib:test :lib:koverVerify :lib:koverXmlReport

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-test-report
          path: lib/build/reports/tests/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lib-coverage-report
          path: lib/build/reports/kover/
          if-no-files-found: warn

  # Best-effort job: :app compilation pulls dozens of Insta360 SDK / native
  # artifacts from external mirrors (aliyun, insta360 Nexus) that intermittently
  # return 502/timeout from cloud runners — failures there are infrastructure,
  # not our code. So this job is non-blocking (continue-on-error). The blocking
  # gate is lib-tests, which covers all the extracted pure logic and has no
  # external-mirror dependency. Run :app tests locally / on a self-hosted runner
  # for a hard guarantee.
  app-unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :app unit tests no longer need the Insta360 SDK at test runtime: all sensor
      # edges sit behind ports (mocked with MockK), and the one Robolectric test uses
      # an empty Application to skip InstaMediaSDK.init(). The SDK artifact is still
      # needed at COMPILE time; it resolves via the guest Nexus credentials hardcoded
      # as a fallback in settings.gradle.kts (do NOT pass empty env vars here — an
      # empty ORG_GRADLE_PROJECT_* shadows the fallback with "" and causes a 401).
      - name: Run :app unit tests with coverage gate
        run: ./gradlew :app:testDebugUnitTest :app:koverVerify :app:koverXmlReport

      # Android lint sits in the same best-effort job because it also pulls the SDK
      # from the flaky external mirrors; a real lint regression shows here without
      # blocking on infrastructure 502s.
      - name: Run Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload app test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload app coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage-report
          path: app/build/reports/kover/
          if-no-files-found: warn
